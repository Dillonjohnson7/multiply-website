<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Demo | Sable Robotics</title>
<meta name="description" content="Sable Robotics is on a mission to triple the American workforce.">
<link rel="canonical" href="https://sablerobotics.ai/demo/">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Sable Robotics">
<meta property="og:title" content="Demo | Sable Robotics">
<meta property="og:description" content="Sable Robotics is on a mission to triple the American workforce.">
<meta property="og:url" content="https://sablerobotics.ai/demo/">
<meta property="og:image" content="https://sablerobotics.ai/brand/og.png">
<meta name="twitter:card" content="summary">
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'DM Sans', sans-serif;
    -webkit-font-smoothing: antialiased;
    background: #000;
    color: #FAFAFA;
    min-height: 100vh;
    min-height: 100svh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 24px;
    position: relative;
    overflow: hidden;
  }

  /* Corner X logos */
  .corner {
    position: absolute;
    width: 22px;
    height: 31px;
  }
  .corner img { width: 100%; height: 100%; display: block; }
  .corner-tl { top: 24px; left: 24px; }
  .corner-tr { top: 24px; right: 24px; }
  .corner-bl { bottom: 24px; left: 24px; }
  .corner-br { bottom: 24px; right: 24px; }

  /* Header */
  .header {
    position: absolute;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 1.3rem;
    font-weight: 700;
    letter-spacing: -0.02em;
    text-align: center;
  }

  .subheader {
    display: block;
    font-size: 0.85rem;
    font-weight: 400;
    margin-top: 4px;
  }

  /* Buttons */
  .buttons {
    display: flex;
    flex-direction: column;
    gap: 16px;
    width: 100%;
    max-width: 400px;
  }

  .demo-btn {
    display: block;
    width: 100%;
    padding: 28px 24px;
    background: transparent;
    border: 1px solid rgba(255,255,255,0.4);
    border-radius: 16px;
    color: #FAFAFA;
    font-family: 'DM Sans', sans-serif;
    font-size: 1.1rem;
    font-weight: 500;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.3s ease, background 0.3s ease;
  }

  .demo-btn:hover {
    border-color: #fff;
    background: rgba(255,255,255,0.06);
  }

  .demo-btn:active {
    background: rgba(255,255,255,0.1);
  }

  .demo-btn .coming-soon {
    display: block;
    font-size: 0.75rem;
    font-weight: 400;
    opacity: 0.45;
    margin-top: 6px;
  }

  a.demo-btn {
    text-decoration: none;
  }
</style>
</head>
<body>

  <div class="corner corner-tl">
    <img src="/brand/sable-logo-white-line.svg" alt="">
  </div>
  <div class="corner corner-tr">
    <img src="/brand/sable-logo-white-line.svg" alt="">
  </div>
  <div class="corner corner-bl">
    <img src="/brand/sable-logo-white-line.svg" alt="">
  </div>
  <div class="corner corner-br">
    <img src="/brand/sable-logo-white-line.svg" alt="">
  </div>

  <div class="header">Sable Robotics<span class="subheader">Workflows</span></div>

  <div class="buttons">
    <button class="demo-btn">3D Printer Manager<span class="coming-soon">[Coming Soon]</span></button>
    <button class="demo-btn">CNC Machine Tending<span class="coming-soon">[Coming Soon]</span></button>
    <a class="demo-btn" href="https://youtu.be/lhWn29ZCWZc" target="_blank" rel="noopener">Printed Part Post Processing</a>
    <button class="demo-btn">Part Sorting<span class="coming-soon">[Coming Soon]</span></button>
  </div>

</body>
</html>
